spring.application.name=tesoura-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tesoura}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=NAMED_ENUM

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:tesoura-dev-secret-change-me-please-32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.whatsapp.provider=${WHATSAPP_PROVIDER:log}
app.whatsapp.zapi.base-url=${ZAPI_BASE_URL:}
app.whatsapp.zapi.instance-id=${ZAPI_INSTANCE_ID:}
app.whatsapp.zapi.token=${ZAPI_TOKEN:}

app.billing.trial-days=14
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
